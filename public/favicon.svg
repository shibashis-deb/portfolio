<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="64" cy="64" r="64" fill="url(#bgGradient)" />
  
  <!-- Opening Brace "{" -->
  <text x="24" y="68" font-family="'Courier New', monospace" font-size="60" font-weight="bold" fill="#ff8c00" text-anchor="middle" dominant-baseline="central">{</text>
  
  <!-- Initials "SD" -->
  <text x="64" y="68" font-family="'Courier New', monospace" font-size="52" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="central" letter-spacing="2">SD</text>
  
  <!-- Closing Brace "}" -->
  <text x="104" y="68" font-family="'Courier New', monospace" font-size="60" font-weight="bold" fill="#ff8c00" text-anchor="middle" dominant-baseline="central">}</text>
</svg>
